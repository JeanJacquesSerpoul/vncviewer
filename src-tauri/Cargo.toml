[package]
name = "vncviewer"
version = "0.1.0"
description = "Visionneuse VNC (Rust · Tauri · Leptos)"
edition = "2024"
license = "MIT"
# Not `vncviewer`, which would clash with TigerVNC / RealVNC (`/usr/bin/vncviewer`).
default-run = "vnc-viewer"

[[bin]]
name = "vnc-viewer"
path = "src/main.rs"

[lib]
name = "vncviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
flate2 = "1"
des = "0.8"
thiserror = "2"
log = "0.4"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
sha2 = "0.10"
num-bigint = "0.4"
aes = "0.8"
md-5 = "0.10"
getrandom = "0.3"
zune-jpeg = "0.5"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
